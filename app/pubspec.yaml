name: theyso
description: "Theyso — drive Claude Code / OpenCode on your PC from your phone. Self-hosted, any model, no relay."
publish_to: "none"
version: 0.1.2+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  web_socket_channel: ^3.0.1
  async: ^2.11.0
  http: ^1.2.2
  cryptography: ^2.7.0          # Ed25519 + HMAC-SHA256 (pure Dart, audited primitives)
  flutter_secure_storage: ^11.2.0 # Android Keystore / iOS Keychain
  mobile_scanner: ^5.2.3         # QR scanning
  local_auth: ^2.3.0             # biometric confirmation for high-risk actions
  flutter_markdown_plus: ^1.0.3  # assistant replies are markdown
  fl_chart: ^0.69.0              # usage dashboard
  intl: ^0.19.0
  speech_to_text: ^7.0.0         # offline dictation (onDevice: true)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  remove_alpha_ios: true

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0F1A"
  image: assets/brand/splash.png
  android_12:
    color: "#0B0F1A"
    image: assets/brand/splash.png

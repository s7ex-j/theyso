[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "theyso"
version = "0.1.2"
description = "Self-hosted bridge to drive Claude Code / OpenCode from your phone — any model, no relay, end-to-end over your own tailnet."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jharol André Vilca Ramos" }]
keywords = ["claude-code", "opencode", "remote", "mobile", "tailscale", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "cryptography>=43",
  "qrcode>=7.4",
  "httpx>=0.27",
  "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "detect-secrets>=1.5"]

[project.scripts]
theyso = "theyso.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["theyso"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
disable_error_code = ["untyped-decorator"]

[tool.bandit]
exclude_dirs = ["tests"]
